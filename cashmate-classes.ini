; ProClasses config for cashmate's roster - class selector, six cards (2026-11-03).
; Needs ProWeapons/ProClasses 1.1.0 or later on the server (mod.io 6336103).
; Use it as the whole [ProClasses] block of Game.ini, or host it and set
;   [ProClasses]  ConfigURL=<raw url of this file>   (applies at every map change, no restart).
; Ids: weapons 1 Longsword, 2 Bastard Sword, 3 Zweihander, 5 Halberd, 6 Pole Axe, 8 Warhammer, 10 Greatsword,
;      11 Spear, 12 Short Sword, 17 Mace, 18 Bardiche, 19 Dagger, 21 Eveningstar, 24 Messer, 26 Estoc, 27 Firepot,
;      31 Maul, 37 Executioner's Sword, 56 Cleaver. Perks: 2 Fury, 12 Second Wind, 14 Rush, 15 Flesh Wound.
; Not expressible here: the '+5%' tags on Messer, Executioner, Maul, Zweihander, Estoc.

[ProClasses]
ClassSelect=1
Default=/ProWeapons/Classes/BP_Class_Default.BP_Class_Default_C
; weapon -> class (players who skip the class screen, and the card inferred from the loadout)
BP_Greatsword_C=Vanguard
BP_Greatsword_NC_C=Vanguard
BP_Poleaxe_C=Vanguard
BP_Poleaxe_NC_C=Vanguard
BP_Messer_C=Vanguard
BP_Messer_NC_C=Vanguard
BP_Longsword_C=Knight
BP_Longsword_NC_C=Knight
BP_Bardiche_C=Knight
BP_Bardiche_NC_C=Knight
BP_BastardSword_C=Knight
BP_BastardSword_NC_C=Knight
BP_Spear_C=Knight
BP_Spear_NC_C=Knight
BP_2Hmace_C=Footman
BP_2Hmace_NC_C=Footman
BP_Halberd_C=Footman
BP_Halberd_NC_C=Footman
BP_ExecutionerSword_C=Raider
BP_ExecutionerSword_NC_C=Raider
BP_Maul_C=Raider
BP_Maul_NC_C=Raider
BP_Zweihander_C=Skirmisher
BP_Zweihander_NC_C=Skirmisher
BP_Estoc_C=Duelist
BP_Estoc_NC_C=Duelist

[Classes]
; New Rat trial (2026-09-26): 2/2/2 armor, Brawler+Stun+SecondWind+Dodge+Acrobat+Bloodlust+Fury+Rat,
; buckler (61) in slot 2, firepot (27) in slot 3. WeaponID:4 swaps the PIE
; longsword for an Arming Sword so the buckler is actually wielded.
TestRat=HeadTier:2,ChestTier:2,LegTier:2,HeadID:5,ChestID:3,LegID:2,Perk1:0,Perk2:21,Perk3:12,Perk4:17,Perk5:1,Perk6:13,Perk7:2,Perk8:7,Gear1:61,Gear2:27,WeaponID:4,LoadoutWeaponID:4

[Weapons]
BP_ZZ_WeaponProbe.StabAttack.Windup=0.5
BP_ZZ_WeaponProbe.StrikeAttack.Damage=1,2,3,4
BP_ZZ_WeaponProbe.StabAttack.bCanCombo=0
BP_ZZ_WeaponProbe.StrikeAttack.TurnCaps=300,200
BP_ZZ_WeaponProbe.StrikeAttack.FeintCost=12

; ===== CLASS SELECTOR (PIE test, 2026-10-28) =====
; Weapons: 1 Longsword (the PIE loadout), 4 Arming Sword, 10 Greatsword.
[ProClasses]
ClassSelect=1

[Classes]
; one class-def per card: armor tiers + the piece ids used when a tier is swapped in; kits and perks live in the rows below
Vanguard=HeadTier:3,ChestTier:3,LegTier:3,HeadID:10,ChestID:4,LegID:4,LoadoutWeaponID:10
Knight=HeadTier:2,ChestTier:3,LegTier:3,HeadID:5,ChestID:4,LegID:4,LoadoutWeaponID:1
Footman=HeadTier:2,ChestTier:2,LegTier:2,HeadID:5,ChestID:3,LegID:2,LoadoutWeaponID:21
Raider=HeadTier:1,ChestTier:2,LegTier:2,HeadID:22,ChestID:3,LegID:2,LoadoutWeaponID:37
Skirmisher=HeadTier:2,ChestTier:1,LegTier:1,HeadID:5,ChestID:7,LegID:11,LoadoutWeaponID:3
Duelist=HeadTier:1,ChestTier:1,LegTier:1,HeadID:22,ChestID:7,LegID:11,LoadoutWeaponID:26

[Selector]
Classes=Vanguard,Knight,Footman,Raider,Skirmisher,Duelist
TierHeadIDs=0,22,5,10
TierChestIDs=0,7,3,4
TierLegIDs=7,11,2,4

