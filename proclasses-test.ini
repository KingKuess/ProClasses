Knight=HeadTier:2,ChestTier:3,LegTier:3,HeadID:5,ChestID:4,LegID:4,LoadoutWeaponID:1
Footman=HeadTier:2,ChestTier:2,LegTier:2,HeadID:5,ChestID:3,LegID:2,LoadoutWeaponID:21
