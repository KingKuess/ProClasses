; ===== end FUN MAUL =====
; Armory "Server Classes" suggestions trimmed to match what is enforced
; (or use HideServerClasses=1 instead to show none at all):
ArmoryClasses=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C,/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C,/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C,/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C,/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C,/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
ArmoryNames=1/3/1 Zweihander Support,1/3/1 Halberd Support,1/3/1 Spear Support,1/3/1 Polehammer Support,1/3/1 Partisan Support,1/3/1 Billhook Support
ArmoryWeaponIDs=3,5,11,65,68,20
;HideServerClasses=1

[Classes]
; ===== FUN MAUL (temporary) - 2/2/2 armor, all five Rat perks (Brawler, Stun,
; Second Wind, Dodge, Acrobat), no gear; armor ids = the default-unlocked tier-2
; pieces (Eisenhut / Chainmail Shirt / Calf Guard Hosen) =====
FunMaul=HeadTier:2,ChestTier:2,LegTier:2,HeadID:5,ChestID:3,LegID:2,Perk1:0,Perk2:21,Perk3:12,Perk4:17,Perk5:1
; ===== end FUN MAUL =====

[Weapons]
; Donor value patches (seconds). Applied to the ProWeapons donor blueprints
; before the removal mod copies them; deleting a line reverts the field at
; the next map load. 2026-09-15: Longsword strike release 500 ms (was 525),
; both grips; Partisan stab release 325 ms (was 350). Greatsword test removed.
; NOTE: the game ignores timings of 1.0 s or more (1.0 did nothing live,
; 0.999 works) - keep every Release/Windup value below 1.0.
BP_NACL_Longsword.StrikeAttack.Release=0.5
BP_NACL_Longsword.SecondStrikeAttack.Release=0.5
BP_NACL_Partisan.StabAttack.Release=0.325

