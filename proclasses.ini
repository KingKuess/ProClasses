; Shield active parry OFF (2026-09-26): shields no longer keep parrying
; during a riposte. Needs the ProWeapons build of 2026-09-26 or later on
; the server (older builds ignore the key). See README.
ShieldActiveParry=0
; Dodge perk (2026-09-17): 15 stamina is the ProClasses default (stock 10),
; DodgeDuration unset = stock 0.35 s. Uncomment to override. (The dodge is a
; fixed-speed push for DodgeDuration seconds, so a longer duration = a longer
; dodge; 50 stamina / 1.4 s was tried and reverted the same night.)
;DodgeStaminaCost=15
;DodgeDuration=0.35

[Classes]
; TEMPORARY durag diagnostic (2026-09-26): Zweihander -> Support tiers (1/3/1) but the tier-1 replacement head is
; the Silky Durag itself (217). If a Zweihander spawn shows the durag, ProClasses' tier read was swapping it; if the
; Peasant Hat persists, the game's own server validation rejects head 217. Revert to the Support lines when done.
DuragTest=HeadTier:1,ChestTier:3,LegTier:1,HeadID:217,ChestID:4,LegID:11,Perk1:0,Perk2:21,Perk3:1,LoadoutWeaponID:5
; Rat (2026-09-26): one-handers only. 2/2/2 (Eisenhut / Chainmail Shirt /
; Calf Guard Hosen), perks Brawler, Stun, Second Wind, Dodge, Acrobat,
; Bloodlust, Fury, Rat; buckler (61) in slot 2, firepot (27) in slot 3.
; Perk6-8 need the ProWeapons build of 2026-09-26 or later.
Rat=HeadTier:2,ChestTier:2,LegTier:2,HeadID:5,ChestID:3,LegID:2,Perk1:0,Perk2:21,Perk3:12,Perk4:17,Perk5:1,Perk6:13,Perk7:2,Perk8:7,Gear1:61,Gear2:27,LoadoutWeaponID:23

[Weapons]
; Donor value patches (seconds). Applied to the ProWeapons donor blueprints
; before the removal mod copies them; deleting a line reverts the field at
; the next map load. 2026-09-15: Partisan stab release 325 ms (was 350).
; NOTE: the game ignores timings of 1.0 s or more (1.0 did nothing live,
; 0.999 works) - keep every Release/Windup value below 1.0.
BP_NACL_Partisan.StabAttack.Release=0.325

; 2026-09-17: Billhook combos 25 ms slower on every attack (strike combo
; 175 -> 200 ms, stab combo 225 -> 250 ms; alt grip included). Delete the
; four lines to revert at the next map load.
BP_NACL_Billhook.StrikeAttack.ComboWindupIncrease=0.2
BP_NACL_Billhook.SecondStrikeAttack.ComboWindupIncrease=0.2
BP_NACL_Billhook.StabAttack.ComboWindupIncrease=0.25
BP_NACL_Billhook.SecondStabAttack.ComboWindupIncrease=0.25

