; ProClasses remote configuration for The Jungle (ProClasses).
; Read by ProWeapons/ProClasses on the server at every map load when the
; server's Game.ini has  [ProClasses] ConfigURL=<raw URL of this file>.
; With ConfigURL set, THIS [ProClasses] section replaces the one in Game.ini.
; Changes take effect on the next map change (the server re-fetches every
; ConfigPollSeconds, default 60). Lines starting with ; or # are comments.
;
; CURRENT MODE (2026-09-15): enforce ONLY the 1/3/1 Support class.
; Players spawning with a Support weapon (Zweihander, Halberd, Spear,
; Polehammer, Partisan, Billhook) are dressed 1/3/1 with the Support perks.
; Every other weapon - and fists - is left completely alone: there is NO
; Default line, so a lookup miss means "keep the player's own loadout".
; Known trade-off: a free-loadout player can pick up a dropped Support
; weapon mid-round and keep their custom build (mid-life pickups never
; re-class, by design).
;
; Optional extra sections (see CLASSES.md):
;   [Classes]  Name=HeadTier:1,ChestTier:3,LegTier:1,HeadID:22,ChestID:4,LegID:11,Perk1:0,Perk2:21,...
;              -> weapon lines above may then use the bare Name instead of an asset path
;   [Weapons]  BP_NACL_Estoc.StrikeAttack.ComboWindupIncrease=0.2
;              -> patches the ProWeapons donor values before the removal mod copies them

[ProClasses]
; Support weapons only - keys are the held weapon class name in all three
; live spellings (chamber-table _NC with cswic useCustomChamber=1, the
; NoThrow variant for Partisan/Corseca, and stock).
BP_Zweihander_NC_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Halberd_NC_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Spear_NC_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Polehammer_NC_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Corseca_NC_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Billhook_NC_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_CorsecaNoThrow_NewVersion_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Zweihander_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Halberd_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Spear_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Polehammer_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Corseca_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
BP_Billhook_C=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
; Armory "Server Classes" suggestions trimmed to match what is enforced
; (or use HideServerClasses=1 instead to show none at all):
ArmoryClasses=/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C,/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C,/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C,/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C,/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C,/ProWeapons/Classes/BP_Class_Support.BP_Class_Support_C
ArmoryNames=1/3/1 Zweihander Support,1/3/1 Halberd Support,1/3/1 Spear Support,1/3/1 Polehammer Support,1/3/1 Partisan Support,1/3/1 Billhook Support
ArmoryWeaponIDs=3,5,11,65,68,20
;HideServerClasses=1
